<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Aula 3 — Editar destino</title>
  <link rel="stylesheet" href="base.css" />
</head>
<body>
  <main class="wrap">
    <p class="kicker">Aula 3 · o papel continua valendo</p>
    <h1>Trocar o destino. Não o slug.</h1>
    <section class="card pad stack" style="max-width: 440px; margin-top: 20px;">
      <h2>Editar destino</h2>
      <label class="field">Título <span class="fake-input">Cartão de visita</span></label>
      <label class="field">URL de destino <span class="fake-input">https://loja.exemplo/promo-de-maio</span></label>
      <p class="muted" style="margin: 0;">Pode trocar depois. O arquivo PNG não muda.</p>
      <div class="qr" aria-hidden="true">
        <i></i><i></i><i></i><i class="off"></i><i></i><i></i><i></i>
        <i></i><i class="off"></i><i></i><i class="off"></i><i></i><i class="off"></i><i></i>
        <i></i><i></i><i></i><i class="off"></i><i></i><i></i><i></i>
        <i class="off"></i><i class="off"></i><i class="off"></i><i></i><i class="off"></i><i class="off"></i><i class="off"></i>
        <i></i><i></i><i></i><i class="off"></i><i></i><i></i><i></i>
        <i></i><i class="off"></i><i></i><i></i><i></i><i class="off"></i><i></i>
        <i></i><i></i><i></i><i class="off"></i><i></i><i></i><i></i>
      </div>
      <p class="callout">A prévia só existe depois que o slug nasceu. Antes disso não há QR para mostrar.</p>
      <div class="row" style="justify-content: flex-end;"><span class="btn-ghost">Cancelar</span><span class="btn">Salvar</span></div>
    </section>
  </main>
</body>
</html>
